<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperVoxel dashboard</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0d10; --panel: #14181d; --line: #262c34; --text: #e6e6e6; --dim: #8b949e; --accent: #58a6ff; --bad: #ff7b72; --good: #7ee787; --warn: #e3b341; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, sans-serif; }
      header { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; flex-wrap: wrap; }
      header h1 { margin: 0; font-size: 18px; }
      header a { color: var(--accent); text-decoration: none; }
      #meta { color: var(--dim); font-size: 12px; }
      #status { margin-left: auto; font-size: 12px; }
      #status.bad { color: var(--bad); } #status.good { color: var(--good); }
      main { padding: 16px; display: grid; gap: 16px; max-width: 1500px; margin: 0 auto; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
      section h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); font-weight: 600; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
      .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
      .tile .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .tile .value { font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
      .tile .sub { color: var(--dim); font-size: 11px; }
      .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
      .chart { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
      .chart .head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
      .chart .head .now { font-variant-numeric: tabular-nums; }
      .chart canvas { width: 100%; height: 90px; display: block; margin-top: 6px; }
      .legend { display: inline-flex; gap: 10px; color: var(--dim); }
      .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
      td.num, th.num { text-align: right; }
      .scroll { overflow-x: auto; }
      .badge { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; border: 1px solid var(--line); color: var(--dim); margin-left: 6px; }
      .badge.on { color: var(--good); border-color: #2e5c36; }
      .players { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 14px; align-items: start; }
      @media (max-width: 800px) { .players { grid-template-columns: 1fr; } }
      #map-wrap { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
      #map, #marks { width: 100%; display: block; image-rendering: pixelated; }
      #marks { position: absolute; inset: 0; }
      #map-world { width: 100%; margin-bottom: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
      .empty { color: var(--dim); padding: 8px 0; }
      #errors li { list-style: none; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
      #errors { margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
      #errors .when { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 8px; }
      #errors .kind { color: var(--warn); margin-right: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>World dashboard</h1>
      <span id="meta"></span>
      <a href="/">Menu</a>
      <span id="status">connecting…</span>
    </header>
    <main>
      <section>
        <h2>Server</h2>
        <div class="tiles" id="tiles"></div>
      </section>
      <section>
        <h2>Last 5 minutes</h2>
        <div class="charts" id="charts"></div>
      </section>
      <section>
        <h2>Worlds</h2>
        <div class="scroll"><table id="worlds"></table></div>
      </section>
      <section>
        <h2>Players</h2>
        <div class="players">
          <div>
            <select id="map-world" aria-label="World shown on the map"></select>
            <div id="map-wrap"><canvas id="map"></canvas><canvas id="marks"></canvas></div>
          </div>
          <div class="scroll"><table id="players"></table></div>
        </div>
      </section>
      <section>
        <h2>Recent errors</h2>
        <ul id="errors"></ul>
      </section>
    </main>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
