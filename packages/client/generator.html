<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperVoxel world generator</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0d10; --panel: #14181d; --line: #262c34; --text: #e6e6e6; --dim: #8b949e; --accent: #6cb6ff; --bad: #ff7b72; --good: #7ee787; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      body { display: flex; }
      #panel { width: 340px; flex: none; height: 100%; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 12px 14px 24px; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      h1 + p { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
      .field { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; align-items: center; }
      .field label { font-size: 12px; }
      .field .value { display: flex; gap: 4px; align-items: center; }
      .field input[type=number] { width: 78px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; font: 12px ui-monospace, monospace; text-align: right; }
      .field input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
      .field .hint { grid-column: 1 / -1; color: var(--dim); font-size: 11px; }
      .field .unit { color: var(--dim); font-size: 11px; min-width: 14px; }
      button { background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--dim); }
      button.primary { background: #1f6feb; border-color: #1f6feb; }
      button:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #name { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; font: 12px ui-monospace, monospace; }
      #message { margin-top: 6px; font-size: 12px; min-height: 1.4em; }
      #message.bad { color: var(--bad); } #message.good { color: var(--good); }
      #message a, #worlds a { color: var(--accent); }
      #worlds { list-style: none; margin: 0; padding: 0; }
      #worlds li { display: flex; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--line); }
      #worlds li span { flex: 1; font-family: ui-monospace, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
      #worlds li em { color: var(--dim); font-style: normal; font-size: 11px; }
      #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #toolbar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      #toolbar label { display: flex; gap: 4px; align-items: center; }
      #stats { color: var(--dim); font: 12px ui-monospace, monospace; }
      #stats.bad { color: var(--bad); }
      #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; position: relative; }
      #map { max-width: 100%; max-height: 100%; aspect-ratio: 1; height: 100%; image-rendering: auto; border: 1px solid var(--line); background: #000; }
      #map.busy { opacity: 0.75; }
      #hover { position: absolute; left: 16px; bottom: 16px; background: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 4px; font: 12px ui-monospace, monospace; pointer-events: none; white-space: pre; }
      #hover:empty { display: none; }
      @media (max-width: 760px) { body { flex-direction: column; } #panel { width: 100%; height: auto; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>World generator</h1>
      <p>Changes redraw the preview. The preview is the exact terrain a new world gets.</p>
      <form id="form" autocomplete="off"></form>
      <div class="row" style="margin-top: 8px"><button type="button" id="reset">Reset to defaults</button></div>
      <h2>Create</h2>
      <div class="row">
        <input id="name" placeholder="world name, e.g. archipelago" maxlength="64" />
        <button type="button" class="primary" id="create">Create</button>
      </div>
      <div id="message"></div>
      <h2>Worlds</h2>
      <ul id="worlds"><li><em>loading…</em></li></ul>
    </div>
    <div id="main">
      <div id="toolbar">
        <label>Show
          <select id="view">
            <option value="terrain">terrain</option>
            <option value="borders" selected>terrain + plate borders</option>
            <option value="plates">plates (minors hatched)</option>
          </select>
        </label>
        <span id="stats">building…</span>
      </div>
      <div id="stage">
        <canvas id="map"></canvas>
        <div id="hover"></div>
      </div>
    </div>
    <script type="module" src="/src/generator.ts"></script>
  </body>
</html>
