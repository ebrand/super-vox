<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperVoxel</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
      #status {
        position: fixed; top: 8px; left: 8px; padding: 6px 10px;
        font: 12px/1.4 ui-monospace, monospace; color: #e6e6e6;
        background: rgba(0, 0, 0, 0.55); border-radius: 4px; white-space: pre;
      }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 14px; height: 14px;
        margin: -7px 0 0 -7px; pointer-events: none;
        background:
          linear-gradient(#fff, #fff) center / 2px 14px no-repeat,
          linear-gradient(#fff, #fff) center / 14px 2px no-repeat;
        mix-blend-mode: difference;
      }
    </style>
  </head>
  <body>
    <div id="status">connecting…</div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
