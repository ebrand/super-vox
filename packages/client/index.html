<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperVoxel</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0d10; --panel: #14181d; --line: #262c34; --text: #e6e6e6; --dim: #8b949e; --accent: #1f6feb; --bad: #ff7b72; --good: #7ee787; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at top, #1a2430, var(--bg) 70%) fixed; color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
      main { width: min(1000px, 100%); margin: 0 auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
      #account { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); min-height: 34px; }
      #account .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #account .who b { color: var(--text); font-weight: 600; }
      #account a.button, #account button { padding: 6px 12px; }
      /* The selected world's picture: its own (if it has one) or its map. */
      #picture { width: min(100%, calc((100vh - 330px) * 2)); align-self: center; position: relative; background: #070809; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 2 / 1; display: flex; align-items: center; justify-content: center; }
      #picture canvas, #picture img { width: 100%; height: 100%; object-fit: contain; display: block; }
      #picture .empty { color: var(--dim); font-size: 13px; }
      #picture-tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
      #picture-tools button { padding: 5px 10px; font-size: 12px; background: rgba(13, 17, 23, 0.8); }
      #details h2 { margin: 0; font-size: 22px; }
      #details .about { color: var(--dim); font-size: 13px; margin-top: 2px; min-height: 1.45em; }
      .chooser { display: flex; gap: 10px; align-items: center; }
      .chooser label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
      select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 7px 8px; font: inherit; }
      #world { flex: 1; min-width: 0; }
      button, a.button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; font: inherit; cursor: pointer; text-decoration: none; }
      button:hover, a.button:hover { border-color: var(--dim); }
      button:disabled { opacity: 0.5; cursor: default; }
      .actions { display: grid; grid-template-columns: repeat(3, 1fr) 1.4fr; gap: 10px; }
      .actions a.button { padding: 12px 14px; }
      #play { background: var(--accent); border-color: var(--accent); font-size: 17px; font-weight: 700; letter-spacing: 0.06em; }
      #tools { font-size: 12px; color: var(--dim); }
      #tools a { color: var(--accent); text-decoration: none; margin-right: 12px; }
      #summary { font: 12px ui-monospace, monospace; color: var(--dim); }
      #status { font-size: 12px; min-height: 1.45em; }
      #status.bad { color: var(--bad); } #status.good { color: var(--good); }
      @media (max-width: 640px) { .actions { grid-template-columns: 1fr 1fr; } #play { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <header id="sv-header"></header>
    <main>
      <div id="account" hidden></div>
      <div id="picture"><span class="empty">loading…</span>
        <div id="picture-tools" hidden>
          <button type="button" id="picture-upload" title="Show a picture of your own for this world instead of its map (PNG, JPEG or WebP, up to 8 MB)">Upload picture…</button>
          <button type="button" id="picture-clear" hidden>Use the map</button>
          <input type="file" id="picture-file" accept="image/png,image/jpeg,image/webp" hidden />
        </div>
      </div>
      <div id="details"><h2 id="world-name"></h2><div class="about" id="about"></div></div>
      <div class="chooser"><label for="world">World</label><select id="world" disabled><option>loading…</option></select></div>
      <div class="actions">
        <a class="button" href="/dashboard.html">World management</a>
        <a class="button" href="/designer.html">Object designer</a>
        <a class="button" id="settings" href="/settings.html?return=%2F">Settings</a>
        <button id="play" disabled>PLAY</button>
      </div>
      <!-- (Until World management lists the worlds with these: see BACKLOG #30.) -->
      <div id="tools">For this world: <a id="terraformer" href="/terraform.html">Terraform</a><a id="sites" href="/sites.html">Find a site</a><a id="claims" href="/claim.html">Make a claim</a><a href="/generator.html">Generate a new world</a></div>
      <div id="summary"></div>
      <div id="status"></div>
    </main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
